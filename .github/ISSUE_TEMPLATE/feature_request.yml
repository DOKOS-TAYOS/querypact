name: Feature request
description: Propose a non-security enhancement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior or API shape.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
  - type: markdown
    attributes:
      value: |
        Note: Current scope and architectural decisions are documented under
        `docs/`. Requests
        that conflict with accepted ADRs may be deferred.
