name: Bug report
description: Report a non-security bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For **security vulnerabilities**, do not use this form. Follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps, commands, or fixtures.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or SHA if known.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
